<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="contacto" class="seccion">
				<h2>Contacto</h2>
				<p>Si tienes dudas o comentarios, puedes escribirnos:</p>

				<form name="contacto" id="contacto"> <!--se empieza asi para indicar donde se almacena el dato (POST-GET)-->
					<fieldset>
						<legend>Formulario de Contacto</legend>
					<br>
						<label>Nombre: </label>>
						<input type= "text"
						required
						id="nombre"
						placeholder="Ingrese su nombre">
					<br><br>
					
						<label>Rut: </label>
						<input type= "text"
						required
						id="rut"
						placeholder="Formato: 12345678-9">
					<br><br>
					
						<label>Correo: </label>
						<input type= "email" id="email">
		
					<br><br>
						<label>Telefono: </label>
						<input type= "tel" id="fono">
					<br><br>
						<label>Fecha de nacimiento: </label>
						<input type= "date" id="fecnac">	
					</fieldset>	
				</form>
			</section>
</body>
</html>
